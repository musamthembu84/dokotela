name: Production Continuous Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: dokotela
  # Unique per-run tag - ECR is IMMUTABLE so a reused tag would fail the push.
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "========================================="
          echo "Building Docker image"
          echo "========================================="
          echo "Image: $IMAGE_URI"

          docker build \
            -t "$IMAGE_URI" \
            .

          echo "========================================="
          echo "Pushing Docker image"
          echo "========================================="

          docker push "$IMAGE_URI"

          echo "========================================="
          echo "Docker image pushed successfully"
          echo "========================================="
          echo "$IMAGE_URI"

      # Populates known_hosts with the EC2 instance's real host key so
      # subsequent SSH/SCP steps use strict host key checking instead of
      # failing because ~/.ssh doesn't exist yet on the runner.
      - name: Prepare SSH known_hosts
        id: known-hosts
        env:
          EC2_PUBLIC_IP: ${{ secrets.EC2_PUBLIC_IP }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          for i in $(seq 1 10); do
            if ssh-keyscan -H "$EC2_PUBLIC_IP" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            echo "Waiting for SSH on $EC2_PUBLIC_IP to become available..."
            sleep 10
          done

          {
            echo "known_hosts<<EOF"
            cat ~/.ssh/known_hosts
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Copy Production Files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.prod.yml,sql_versions"
          target: "/home/ubuntu/app"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # DB/Redis endpoints and the app URL come from GitHub Secrets that
          # are kept in sync with the real Terraform outputs by
          # terraform/sync-outputs-to-github-secrets.sh (run manually after
          # `terraform apply`) - never hand-typed.
          DB_HOST: ${{ secrets.AWS_RDS_ENDPOINT }}
          DB_PASSWORD: ${{ secrets.AWS_RDS_PASSWORD }}
          REDIS_HOST: ${{ secrets.AWS_REDIS_ENDPOINT }}
          PAYFAST_MERCHANT_ID: ${{ secrets.PAYFAST_MERCHANT_ID }}
          PAYFAST_MERCHANT_KEY: ${{ secrets.PAYFAST_MERCHANT_KEY }}
          PAYFAST_PASSPHRASE: ${{ secrets.PAYFAST_PASSPHRASE }}
          PAYFAST_SANDBOX: ${{ secrets.PAYFAST_SANDBOX }}
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
          AGORA_APP_CERTIFICATE: ${{ secrets.AGORA_APP_CERTIFICATE }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          # Falls back to the Terraform-derived APP_URL secret when not
          # explicitly overridden, so PayFast return/cancel/notify URLs are
          # never accidentally left pointing at localhost.
          APP_BASE_URL: ${{ secrets.APP_BASE_URL || secrets.APP_URL }}
          FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL || secrets.APP_URL }}

        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          known_hosts: ${{ steps.known-hosts.outputs.known_hosts }}
          envs: ECR_REGISTRY,IMAGE_TAG,DB_HOST,DB_PASSWORD,REDIS_HOST,PAYFAST_MERCHANT_ID,PAYFAST_MERCHANT_KEY,PAYFAST_PASSPHRASE,PAYFAST_SANDBOX,AGORA_APP_ID,AGORA_APP_CERTIFICATE,SECRET_KEY,APP_BASE_URL,FRONTEND_BASE_URL

          script: |
            set -e

            cd /home/ubuntu/app

            echo "========================================="
            echo "Validating required environment variables"
            echo "========================================="

            for var in DB_HOST DB_PASSWORD REDIS_HOST PAYFAST_MERCHANT_ID PAYFAST_MERCHANT_KEY PAYFAST_PASSPHRASE PAYFAST_SANDBOX AGORA_APP_ID AGORA_APP_CERTIFICATE SECRET_KEY APP_BASE_URL FRONTEND_BASE_URL; do
              if [ -z "${!var}" ]; then
                echo "ERROR: required variable $var is empty. Aborting deploy."
                exit 1
              fi
            done

            echo "========================================="
            echo "Creating production environment"
            echo "========================================="

            cat <<EOT > .env
            ECR_REPOSITORY_URL=$ECR_REGISTRY/dokotela
            IMAGE_TAG=$IMAGE_TAG

            DB_HOST=$DB_HOST
            DB_NAME=postgres
            DB_USER=db_admin_musa
            DB_PASSWORD=$DB_PASSWORD

            REDIS_HOST=$REDIS_HOST

            PAYFAST_MERCHANT_ID=$PAYFAST_MERCHANT_ID
            PAYFAST_MERCHANT_KEY=$PAYFAST_MERCHANT_KEY
            PAYFAST_PASSPHRASE=$PAYFAST_PASSPHRASE
            PAYFAST_SANDBOX=$PAYFAST_SANDBOX

            AGORA_APP_ID=$AGORA_APP_ID
            AGORA_APP_CERTIFICATE=$AGORA_APP_CERTIFICATE

            SECRET_KEY=$SECRET_KEY
            APP_BASE_URL=$APP_BASE_URL
            FRONTEND_BASE_URL=$FRONTEND_BASE_URL
            EOT

            chmod 600 .env

            echo "========================================="
            echo "Deployment image"
            echo "========================================="
            echo "$ECR_REGISTRY/dokotela:$IMAGE_TAG"

            echo "========================================="
            echo "Logging Docker into Amazon ECR"
            echo "========================================="

            aws ecr get-login-password \
              --region us-east-1 \
              | docker login \
                --username AWS \
                --password-stdin "$ECR_REGISTRY"

            echo "========================================="
            echo "Validating Docker Compose configuration"
            echo "========================================="

            docker compose \
              -f docker-compose.prod.yml \
              config --quiet

            echo "========================================="
            echo "Pulling FastAPI image from ECR"
            echo "========================================="

            docker compose \
              -f docker-compose.prod.yml \
              pull fastapi

            echo "========================================="
            echo "Starting production services"
            echo "========================================="

            docker compose \
              -f docker-compose.prod.yml \
              up -d --force-recreate --wait

            echo "========================================="
            echo "Deployment status"
            echo "========================================="

            docker compose \
              -f docker-compose.prod.yml \
              ps

      # Fails the workflow immediately if the deployment is broken, instead
      # of the team discovering Redis/DB/API connectivity problems manually
      # after the fact.
      - name: Smoke Test - API, Database, Redis
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          known_hosts: ${{ steps.known-hosts.outputs.known_hosts }}
          script: |
            set -e
            cd /home/ubuntu/app

            echo "========================================="
            echo "Smoke test: FastAPI container health"
            echo "========================================="
            timeout 60 bash -c 'until docker compose -f docker-compose.prod.yml ps fastapi | grep -q "healthy"; do sleep 3; done'

            echo "========================================="
            echo "Smoke test: API reachable over HTTP"
            echo "========================================="
            curl -f -sS http://127.0.0.1:8000/health

            echo "========================================="
            echo "Smoke test: Database connectivity"
            echo "========================================="
            docker run --rm --network host postgres:17-alpine \
              pg_isready -h "$(grep '^DB_HOST=' .env | cut -d= -f2)" -p 5432

            echo "========================================="
            echo "Smoke test: Redis connectivity"
            echo "========================================="
            docker run --rm --network host redis:7-alpine \
              redis-cli -h "$(grep '^REDIS_HOST=' .env | cut -d= -f2)" -p 6379 ping

            echo "========================================="
            echo "All smoke tests passed"
            echo "========================================="
